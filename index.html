<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RiskMapper Nepal — Kathmandu Seismic Risk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #070a0a;
    --surface: #0e1414;
    --surface2: #141c1c;
    --surface3: #1a2424;
    --border: #1f2e2e;
    --border2: #263535;
    --text: #e8f0ef;
    --text-dim: #6b8888;
    --text-muted: #3d5555;
    --accent: #00e5a0;
    --accent-dim: rgba(0,229,160,0.12);
    --accent-glow: rgba(0,229,160,0.25);
    --critical: #ff3b3b;
    --high: #ff8c42;
    --moderate: #f5c842;
    --low: #42e87a;
    --critical-bg: rgba(255,59,59,0.1);
    --high-bg: rgba(255,140,66,0.1);
    --moderate-bg: rgba(245,200,66,0.1);
    --low-bg: rgba(66,232,122,0.1);
    --font-mono: 'Space Mono', monospace;
    --font-sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── TOPBAR ── */
  header {
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .logo-text {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text);
  }

  .logo-text span { color: var(--accent); }

  .header-stats {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .hstat {
    padding: 4px 12px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    border: 1px solid transparent;
  }

  .hstat.critical { background: var(--critical-bg); color: var(--critical); border-color: rgba(255,59,59,0.2); }
  .hstat.high { background: var(--high-bg); color: var(--high); border-color: rgba(255,140,66,0.2); }
  .hstat.moderate { background: var(--moderate-bg); color: var(--moderate); border-color: rgba(245,200,66,0.2); }
  .hstat.low { background: var(--low-bg); color: var(--low); border-color: rgba(66,232,122,0.2); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.08em;
  }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* ── MAIN LAYOUT ── */
  .app-body {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  aside {
    width: 300px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .section-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* Search */
  .search-wrap {
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 12px;
    padding: 8px 10px 8px 32px;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--text-muted); }

  .search-icon {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
  }

  /* Ward list */
  .ward-list-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .ward-list-wrap::-webkit-scrollbar { width: 3px; }
  .ward-list-wrap::-webkit-scrollbar-track { background: transparent; }
  .ward-list-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .ward-item {
    display: flex;
    align-items: center;
    padding: 8px 10px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
    gap: 10px;
    margin-bottom: 2px;
  }

  .ward-item:hover { background: var(--surface2); border-color: var(--border); }
  .ward-item.active { background: var(--accent-dim); border-color: var(--accent); }

  .ward-rank {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-muted);
    width: 16px;
    text-align: right;
    flex-shrink: 0;
  }

  .ward-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .ward-info { flex: 1; min-width: 0; }

  .ward-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ward-num {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-dim);
  }

  .ward-score-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* Buttons */
  .sidebar-actions {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid var(--border);
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    font-weight: 700;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }

  .btn-primary:hover { background: #00ffb3; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border2);
  }

  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .btn.active-sim { background: #ff3b3b; color: #fff; animation: btn-pulse 1.5s infinite; }
  @keyframes btn-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,59,59,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(255,59,59,0); }
  }

  /* ── MAP AREA ── */
  .map-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #map {
    width: 100%;
    height: 100%;
    background: #0a1212;
  }

  /* Override Leaflet for dark theme */
  .leaflet-container { background: #0a1212 !important; }
  .leaflet-tile { filter: brightness(0.3) saturate(0.4) hue-rotate(160deg); }

  /* Floating panels */
  .map-overlay {
    position: absolute;
    z-index: 500;
    pointer-events: none;
  }

  .map-overlay * { pointer-events: auto; }

  /* Top info bar */
  .map-top {
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .alert-banner {
    background: rgba(10,20,20,0.9);
    border: 1px solid var(--critical);
    border-radius: 4px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    backdrop-filter: blur(8px);
  }

  .alert-icon {
    color: var(--critical);
    font-size: 14px;
    animation: pulse 1.5s infinite;
  }

  .alert-text {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--critical);
    letter-spacing: 0.08em;
  }

  /* Ward detail panel */
  .ward-detail {
    position: absolute;
    bottom: 14px;
    left: 14px;
    width: 260px;
    background: rgba(10,20,20,0.92);
    border: 1px solid var(--border2);
    border-radius: 6px;
    backdrop-filter: blur(12px);
    z-index: 500;
    overflow: hidden;
    transition: all 0.3s;
    transform-origin: bottom left;
  }

  .ward-detail.hidden { opacity: 0; transform: scale(0.95) translateY(8px); pointer-events: none; }

  .wd-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .wd-title {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }

  .wd-sub {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .wd-score {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
  }

  .wd-body { padding: 12px 14px; }

  .wd-factor {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
  }

  .wd-factor-label {
    font-size: 10px;
    color: var(--text-dim);
    width: 90px;
    flex-shrink: 0;
  }

  .wd-bar-wrap {
    flex: 1;
    height: 4px;
    background: var(--surface3);
    border-radius: 2px;
    overflow: hidden;
  }

  .wd-bar {
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transition: width 0.5s ease;
  }

  .wd-factor-val {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    width: 22px;
    text-align: right;
  }

  .wd-close {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px;
  }

  .wd-close:hover { color: var(--text); }

  /* Stats panel (bottom right) */
  .stats-panel {
    position: absolute;
    bottom: 14px;
    right: 14px;
    width: 200px;
    background: rgba(10,20,20,0.92);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 14px;
    backdrop-filter: blur(12px);
    z-index: 500;
  }

  .sp-title {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .sp-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .sp-color { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .sp-label { font-size: 11px; color: var(--text-dim); flex: 1; }
  .sp-count { font-family: var(--font-mono); font-size: 11px; font-weight: 700; }

  /* Cascade info */
  .cascade-info {
    position: absolute;
    top: 50px;
    right: 14px;
    width: 220px;
    background: rgba(10,20,20,0.92);
    border: 1px solid rgba(255,59,59,0.3);
    border-radius: 6px;
    padding: 14px;
    backdrop-filter: blur(12px);
    z-index: 500;
    display: none;
  }

  .cascade-info.visible { display: block; }

  .ci-title {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--critical);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ci-wave {
    height: 3px;
    background: linear-gradient(to right, var(--critical), transparent);
    border-radius: 2px;
    margin-bottom: 10px;
    animation: wave-expand 2s infinite;
  }

  @keyframes wave-expand {
    0% { width: 0%; opacity: 1; }
    100% { width: 100%; opacity: 0; }
  }

  .ci-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    margin-bottom: 4px;
  }

  .ci-ward-name { color: var(--text-dim); }
  .ci-prob { font-family: var(--font-mono); font-weight: 700; }

  /* Map zoom controls */
  .leaflet-control-zoom {
    border: 1px solid var(--border2) !important;
    box-shadow: none !important;
  }

  .leaflet-control-zoom a {
    background: var(--surface) !important;
    color: var(--text-dim) !important;
    border-color: var(--border2) !important;
  }

  .leaflet-control-zoom a:hover {
    background: var(--surface2) !important;
    color: var(--accent) !important;
  }

  /* Custom map popup */
  .leaflet-popup-content-wrapper {
    background: rgba(14,20,20,0.95) !important;
    border: 1px solid var(--border2) !important;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
    border-radius: 6px !important;
    backdrop-filter: blur(12px);
  }

  .leaflet-popup-tip { background: rgba(14,20,20,0.95) !important; }
  .leaflet-popup-content { color: var(--text); margin: 0; }

  /* Formula strip */
  .formula-strip {
    position: absolute;
    top: 50px;
    left: 14px;
    background: rgba(10,20,20,0.85);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-muted);
    backdrop-filter: blur(8px);
    z-index: 500;
    letter-spacing: 0.04em;
  }

  .formula-strip span { color: var(--accent); }

  /* Loading overlay */
  #loading {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 16px;
  }

  .loading-text {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.1em;
    animation: blink 1s infinite;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .loading-bar {
    width: 200px;
    height: 2px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .loading-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    animation: load-slide 1.2s ease-in-out infinite;
  }

  @keyframes load-slide {
    0% { width: 0%; margin-left: 0%; }
    50% { width: 60%; margin-left: 20%; }
    100% { width: 0%; margin-left: 100%; }
  }

  /* Cascasde legend */
  .cascade-legend {
    position: absolute;
    right: 14px;
    top: 50px;
    z-index: 500;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-text">INITIALIZING RISKMAPPER NEPAL</div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
</div>

<header>
  <div class="logo">
    <div class="logo-icon"></div>
    <span class="logo-text">RISK<span>MAPPER</span> NEPAL</span>
  </div>
  <div class="header-stats" id="header-stats"></div>
  <div class="header-right">
    <div class="live-badge">
      <div class="live-dot"></div>
      MODEL ACTIVE
    </div>
  </div>
</header>

<div class="app-body">
  <aside>
    <div class="sidebar-section">
      <div class="section-label">Ward Search</div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" id="ward-search" placeholder="Search wards..."/>
      </div>
    </div>

    <div class="sidebar-section" style="padding-bottom:8px;">
      <div class="section-label">Vulnerability Ranking</div>
    </div>

    <div class="ward-list-wrap" id="ward-list"></div>

    <div class="sidebar-actions">
      <button class="btn btn-primary" id="cascade-btn">⚡ SIMULATE CASCADE</button>
      <button class="btn btn-secondary" id="evac-btn">⟶ SHOW EVAC ROUTES</button>
    </div>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>

    <!-- Top overlay -->
    <div class="map-overlay map-top">
      <div class="alert-banner">
        <span class="alert-icon">▲</span>
        <span class="alert-text">SEISMIC RISK MODEL — KATHMANDU VALLEY — FORWARD-LOOKING</span>
      </div>
    </div>

    <!-- Formula strip -->
    <div class="formula-strip map-overlay" style="top:50px; left:14px;">
      Risk = <span>0.30</span>×Age + <span>0.30</span>×Material + <span>0.25</span>×Fault + <span>0.15</span>×Soil
    </div>

    <!-- Cascade info panel -->
    <div class="cascade-info map-overlay" id="cascade-info" style="top:90px; right:14px; position:absolute;">
      <div class="ci-title">
        <span style="color:var(--critical); animation:pulse 1s infinite;">●</span>
        CASCADE SIMULATION
      </div>
      <div class="ci-wave" id="cascade-wave"></div>
      <div id="cascade-rows"></div>
    </div>

    <!-- Ward detail panel -->
    <div class="ward-detail hidden" id="ward-detail">
      <div class="wd-header">
        <div>
          <div class="wd-title" id="wd-name">—</div>
          <div class="wd-sub" id="wd-sub">—</div>
        </div>
        <div class="wd-score" id="wd-score">—</div>
      </div>
      <div class="wd-body" id="wd-body"></div>
      <button class="wd-close" id="wd-close">✕</button>
    </div>

    <!-- Stats panel -->
    <div class="stats-panel" id="stats-panel">
      <div class="sp-title">Risk Distribution</div>
      <div id="stats-rows"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
